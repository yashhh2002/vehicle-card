<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Owner Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 30px 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .header { text-align: center; margin-bottom: 28px; }
  .avatar {
    width: 70px; height: 70px;
    background: #e8f4fd;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin: 0 auto 12px;
  }
  .owner-name { font-size: 24px; font-weight: bold; color: #1a1a2e; }
  .label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .section-title { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; margin-top: 24px; }
  .btn {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 14px 18px; border-radius: 12px;
    border: none; cursor: pointer; font-size: 15px; font-weight: 600;
    text-decoration: none; margin-bottom: 10px; transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.8; }
  .btn-call { background: #e8f5e9; color: #2e7d32; }
  .btn-whatsapp { background: #e8f5e9; color: #1b5e20; }
  .btn-icon { font-size: 20px; }
  .btn-label { flex: 1; text-align: left; }
  .divider { height: 1px; background: #f0f0f0; margin: 20px 0; }
  .friend-name { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 10px; }
  .mini-btns { display: flex; gap: 10px; }
  .mini-btn {
    flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 12px; border-radius: 10px; border: none;
    cursor: pointer; font-size: 14px; font-weight: 600;
    text-decoration: none; transition: opacity 0.2s;
  }
  .mini-btn:active { opacity: 0.8; }
  .mini-call { background: #fff3e0; color: #e65100; }
  .mini-wa { background: #e8f5e9; color: #1b5e20; }
  .footer { text-align: center; margin-top: 24px; font-size: 11px; color: #bbb; }
</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:40px;color:#999">Loading...</div></div>
<script>
const SUPABASE_URL = 'https://gpxvajcsbwctyshicbvq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SpTLdM13SauXhA_O1yTqag_dRRK_XeK';
const clientId = new URLSearchParams(window.location.search).get('id') || 'yash-001';

async function load() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/clients?client_id=eq.${clientId}&select=*`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    const data = await res.json();
    if (!data || data.length === 0) throw new Error('Not found');
    render(data[0]);
  } catch(e) {
    document.getElementById('app').innerHTML = `<div style="text-align:center;padding:40px;color:red">⚠️ Data load nahi hua</div>`;
  }
}

function render(c) {
  const phone = c.owner_phone || '';
  const wa = c.owner_whatsapp || phone.replace(/[^0-9]/g,'');
  const friendPhone = c.friend_phone || '';
  const friendWa = friendPhone.replace(/[^0-9]/g,'');

  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="header">
        <div class="avatar">👤</div>
        <div class="owner-name">${c.owner_name || 'Owner'}</div>
        <div class="label">Vehicle Owner</div>
      </div>
      <div class="section-title">Contact Owner</div>
      <a href="tel:${phone}" class="btn btn-call">
        <span class="btn-icon">📞</span>
        <span class="btn-label">Call Owner</span>
        <span>›</span>
      </a>
      <a href="https://wa.me/${wa}" target="_blank" class="btn btn-whatsapp">
        <span class="btn-icon">💬</span>
        <span class="btn-label">WhatsApp</span>
        <span>›</span>
      </a>
      ${friendPhone ? `
      <div class="divider"></div>
      <div class="section-title">Emergency Contact</div>
      <div class="friend-name">👥 Friend</div>
      <div class="mini-btns">
        <a href="tel:${friendPhone}" class="mini-btn mini-call">📞 Call</a>
        <a href="https://wa.me/${friendWa}" target="_blank" class="mini-btn mini-wa">💬 WhatsApp</a>
      </div>` : ''}
      <div class="footer">🔒 Numbers are private</div>
    </div>`;
}

load();
</script>
</body>
</html>
